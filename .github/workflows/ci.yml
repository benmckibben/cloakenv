name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly dependency audit, so new RustSec advisories against the locked
  # dependency tree show up without a push. Only the cargo-deny job runs on
  # schedule; the build/test jobs skip (they gate on event_name below).
  schedule:
    - cron: "17 14 * * 1" # Mondays 14:17 UTC

# Read-only token: CI never needs to write to the repo. No publishing here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# Third-party actions are pinned to full commit SHAs (tag in the trailing
# comment); Dependabot keeps them current via .github/dependabot.yml.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'schedule'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, toolchain: stable }
          # Must match rust-version in Cargo.toml (MSRV).
          - { os: ubuntu-24.04, toolchain: "1.87" }
          # Vault permissions, process spawning and --shield use Unix APIs
          # that differ on macOS; run the suite there too.
          - { os: macos-15, toolchain: stable }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.toolchain }}
      - run: cargo test --locked --no-fail-fast

  # x86_64 Windows (MSVC). The README still lists Windows as unsupported until
  # the remaining work lands, but this job is a required check so that what
  # already works cannot regress. It is named like the test matrix; besides
  # `cargo test` it builds, runs clippy and a scripted smoke test of the binary.
  windows:
    name: test (windows-2025, stable)
    runs-on: windows-2025
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-stable
      - name: build
        run: cargo build --locked --target x86_64-pc-windows-msvc
      - name: clippy
        run: cargo clippy --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
      - name: test
        run: cargo test --locked --no-fail-fast --target x86_64-pc-windows-msvc
      # Scripted end-to-end behaviour of the built binary. Passphrase comes from
      # the environment (there is no terminal in CI); the throwaway secrets are
      # random-looking strings that exist only in this job.
      - name: smoke
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'target/x86_64-pc-windows-msvc/debug/cloakenv.exe'
          $work = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'smoke')
          Set-Location $work
          $env:CLOAKENV_PASSPHRASE = 'ci-smoke-passphrase-not-a-secret'
          $failed = 0
          function Check([string]$name, [bool]$ok, [string]$detail = '') {
            if ($ok) { Write-Host "CHECK PASS $name" }
            else { Write-Host "CHECK FAIL $name :: $detail"; $script:failed++ }
          }
          Write-Host "version: $(& $exe --version)"
          & $exe init; Check 'init' ($LASTEXITCODE -eq 0) "exit $LASTEXITCODE"
          Set-Content -Path .env -Value "ZED_KEY=zedsecret-1f3a9c`nALPHA_KEY=alphasecret-77b2e0" -Encoding utf8NoBOM
          & $exe import .env; Check 'import' ($LASTEXITCODE -eq 0) "exit $LASTEXITCODE"
          $names = (& $exe list) -join ','
          Check 'list names only, sorted' ($names -eq 'ALPHA_KEY,ZED_KEY') $names
          $out = (& $exe run -- cmd /c 'echo %ZED_KEY%') -join ''
          Check 'run injects the secret' ($out.Trim() -eq 'zedsecret-1f3a9c') $out
          $out = (& $exe run --shield -- cmd /c 'echo %ZED_KEY% %ALPHA_KEY%') -join ''
          Check 'shield redacts stdout' (($out -notmatch 'secret-') -and ($out -match 'REDACTED_BY_CLOAKENV')) $out
          $out = (& $exe run --shield -- cmd /c 'echo %ZED_KEY% 1>&2') 2>&1 | Out-String
          Check 'shield redacts stderr' (($out -notmatch 'secret-') -and ($out -match 'REDACTED_BY_CLOAKENV')) $out
          & $exe run -- cmd /c 'exit 7'; Check 'exit code 7 passes through' ($LASTEXITCODE -eq 7) "exit $LASTEXITCODE"
          & $exe run -- cmd /c 'exit 0'; Check 'exit code 0 passes through' ($LASTEXITCODE -eq 0) "exit $LASTEXITCODE"
          $out = (& $exe run -- cmd /c 'echo %CLOAKENV_PASSPHRASE%') -join ''
          Check 'passphrase variable is not passed to the command' ($out.Trim() -eq '%CLOAKENV_PASSPHRASE%') $out
          # .NET resolves relative paths against the process cwd, not
          # PowerShell's location, so build an absolute path.
          $vault = Join-Path $work '.cloak/vault.bin'
          $bytes = [IO.File]::ReadAllBytes($vault)
          $text = [Text.Encoding]::Latin1.GetString($bytes)
          Check 'vault holds no plaintext' (-not ($text.Contains('zedsecret') -or $text.Contains('alphasecret'))) ''
          $bytes[[int]($bytes.Length / 2)] = $bytes[[int]($bytes.Length / 2)] -bxor 1
          [IO.File]::WriteAllBytes($vault, $bytes)
          & $exe list 2>$null | Out-Null; Check 'tampered vault is refused' ($LASTEXITCODE -ne 0) "exit $LASTEXITCODE"
          # Informational, not a pass/fail: who can read the vault by default?
          Write-Host '--- ACL of the vault file and directory (informational) ---'
          icacls $vault; icacls (Join-Path $work '.cloak')
          Write-Host "--- smoke: $failed check(s) failed ---"
          if ($failed -gt 0) { exit 1 }

  # Dependency audit against deny.toml: RustSec advisories (vulnerable, unsound,
  # unmaintained, yanked), licence allow-list, bans (wildcards, duplicates) and
  # sources (crates.io only). The only job that also runs on the weekly schedule.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The prebuilt release binary, checked against its published SHA-256. The
      # cargo-deny-action builds a Docker image from Docker Hub on every run,
      # which fails whenever Docker Hub rate-limits the runner.
      - name: Install cargo-deny
        env:
          VERSION: 0.20.2
          SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-$VERSION-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-connrefused --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$VERSION/$name.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 "$name/cargo-deny"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: cargo-deny --all-features check
