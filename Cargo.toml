[package]
name = "cloakenv"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Lightweight encrypted local secret vault and zero-leak process injection engine"
repository = "https://github.com/benmckibben/cloakenv"
documentation = "https://github.com/benmckibben/cloakenv#readme"
readme = "README.md"
keywords = ["secrets", "security", "vault", "env", "cli"]
categories = ["command-line-utilities", "development-tools"]
# Only what is needed to build, test and understand the crate. Every pattern is
# anchored to the package root ("/..."), so nested files with the same name
# (a README or LICENSE in a subdirectory, say) never match. Check the result
# with `cargo package --list --locked`.
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/docs/*.md",
    "/src/**/*.rs",
    "/tests/**/*.rs",
]

[lib]
name = "cloakenv"
path = "src/lib.rs"

[[bin]]
name = "cloakenv"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4"
rpassword = "7.5.4"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

# Unix only. rustix: safe wrappers for flock(2) (vault locking), prctl(2)/setrlimit(2)
# (process hardening), waitid(2)/kill(2)/poll(2) (supervising the --shield child).
# signal-hook: forwards signals to that child (its iterator mode keeps the
# signal handler itself async-signal-safe). libc: one read-only sigaction(2)
# query (is a signal ignored?) in src/sys.rs, the crate's only unsafe code.
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
rustix = { version = "1.1.5", features = ["fs", "process", "event"] }
signal-hook = { version = "0.4.5", default-features = false, features = ["iterator"] }

[dev-dependencies]
tempfile = "3.27.0"

# Argon2id is painfully slow without optimizations; keep debug builds and the
# test suite usable while still exercising production-strength KDF parameters.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
