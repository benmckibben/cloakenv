name: Release build

# Builds the release binaries and, for a real tag, creates a DRAFT GitHub
# release from them. It never publishes:
#   - the draft is only visible to people who can write to this repository, and
#     stays a draft until a maintainer publishes it by hand;
#   - no cargo publish, no crates.io token, no repository secrets (the built-in
#     GITHUB_TOKEN is used, and only the "release" job gets a write scope);
#   - no attestations (see "Provenance" below).
# A run started by hand (workflow_dispatch) has no tag: it builds and uploads the
# archives as artifacts of the run and stops there. crates.io is a manual step;
# see CONTRIBUTING.md.
#
# It has no schedule trigger: only a `v*` tag push or a manual dispatch starts it.

on:
  push:
    tags: ["v*"]
  # Dry-run the whole pipeline from any branch, without a tag.
  workflow_dispatch:

# Read-only token, workflow-wide. Don't add write scopes here: a release
# workflow that can write is one bug away from publishing. The one job that
# needs to write (creating the draft release) asks for it on its own.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# Provenance: not enabled on purpose. actions/attest-build-provenance needs
# id-token: write and attestations: write; artifact attestations aren't
# available for private repositories on GitHub Free/Pro; and on a public
# repository they are signed with the public-good Sigstore instance and
# recorded in its public transparency log, which is a public publication that
# this workflow must not make without a decision. Once the repository is public and a
# real release is intended, add the action to the "checksums" job (grant the
# two write permissions on that job only, not workflow-wide) and attest
# out/*.tar.gz and out/SHA256SUMS.

# Third-party actions are pinned to full commit SHAs (tag in the trailing
# comment); Dependabot keeps them current via .github/dependabot.yml.

jobs:
  # Cheap, fast guard: does the tag match the crate, is it on main, and does
  # the changelog have a section for it?
  guard:
    name: tag and version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tagged commit must be reachable from the default branch
      - id: meta
        name: Check the tag against Cargo.toml
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "cloakenv") | .version')
          if [ -z "$version" ]; then
            echo "::error::couldn't read the version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $version"

          if [ "$REF_TYPE" != "tag" ]; then
            echo "::notice::not a tag run ($REF_TYPE $REF_NAME): building $version for testing only"
            exit 0
          fi

          # v<semver>, nothing else.
          if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$REF_NAME' is not of the form vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          if [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag '$REF_NAME' doesn't match version $version in Cargo.toml (expected v$version)"
            exit 1
          fi

          # Never release a commit that isn't on the default branch.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$GITHUB_SHA is not reachable from $DEFAULT_BRANCH; release tags must point at a commit on $DEFAULT_BRANCH"
            exit 1
          fi

          # The release must have its own changelog section (moved out of
          # "Unreleased").
          if ! grep -Eq "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          echo "tag $REF_NAME matches Cargo.toml, is on $DEFAULT_BRANCH and has a changelog section"

  # The same checks CI runs, on the commit being released: formatting, clippy,
  # and the test suite on stable, on the MSRV, on macOS and on static musl.
  checks:
    name: checks (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: "linux stable", os: ubuntu-24.04, toolchain: stable, lint: true }
          # "1.87" must match rust-version in Cargo.toml (MSRV).
          - { name: "linux msrv", os: ubuntu-24.04, toolchain: "1.87" }
          - { name: "macos stable", os: macos-15, toolchain: stable }
          - { name: "linux musl", os: ubuntu-24.04, toolchain: stable, target: x86_64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.name }}
      - name: rustfmt
        if: matrix.lint
        run: cargo fmt --all --check
      - name: clippy
        if: matrix.lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          args=(--locked --no-fail-fast)
          if [ -n "$TARGET" ]; then
            args+=(--target "$TARGET")
          fi
          cargo test "${args[@]}"

  # Dependency audit against deny.toml (advisories, licences, bans, sources),
  # the same action and arguments as ci.yml.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The prebuilt release binary, checked against its published SHA-256. The
      # cargo-deny-action builds a Docker image from Docker Hub on every run,
      # which fails whenever Docker Hub rate-limits the runner.
      - name: Install cargo-deny
        env:
          VERSION: 0.20.2
          SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-$VERSION-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-connrefused --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$VERSION/$name.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 "$name/cargo-deny"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: cargo-deny --all-features check

  # cargo package builds the .crate that would go to crates.io, entirely
  # locally (and verifies it compiles from the extracted package). Nothing is
  # uploaded or published; this only checks what would be in it.
  package:
    name: package check (cargo package)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-package
      - name: cargo package --locked (build and verify the .crate locally)
        run: cargo package --locked
      - name: Check the package contents
        run: |
          set -euo pipefail
          cargo package --list --locked > files.txt
          echo "::group::cargo package --list"
          cat files.txt
          echo "::endgroup::"

          # Allow-list: the manifest, lockfile, docs (and the design records under
          # docs/design/), licences, sources, tests, and the golden vault files that
          # the tests open (tests/fixtures/v1/*.bin and many.env, nothing else).
          # Anything else (editor files, CI config, notes, keys, ...) fails.
          allowed='^(Cargo\.toml|Cargo\.toml\.orig|Cargo\.lock|\.cargo_vcs_info\.json|README\.md|CHANGELOG\.md|SECURITY\.md|CONTRIBUTING\.md|LICENSE-MIT|LICENSE-APACHE|docs/[A-Za-z0-9_-]+\.md|docs/design/[A-Za-z0-9_-]+\.md|src/[A-Za-z0-9_/]+\.rs|tests/[A-Za-z0-9_/]+\.rs|tests/fixtures/v1/[A-Za-z0-9_.-]+\.(bin|env))$'
          unexpected=$(grep -Ev "$allowed" files.txt || true)
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected files in the package:"
            echo "$unexpected"
            exit 1
          fi

          for f in Cargo.toml Cargo.lock README.md CHANGELOG.md SECURITY.md CONTRIBUTING.md LICENSE-MIT LICENSE-APACHE docs/ARCHITECTURE.md src/main.rs src/lib.rs; do
            if ! grep -qx "$f" files.txt; then
              echo "::error::$f is missing from the package"
              exit 1
            fi
          done

          # Belt and braces: look inside the packaged files for things that
          # shouldn't ship (local paths, agent tooling, credentials). The token
          # patterns need a realistic length: the tests deliberately contain
          # dummy secrets shaped like tokens but cut short (ghp_ta…ue42).
          version=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "cloakenv") | .version')
          crate="target/package/cloakenv-$version.crate"
          ls -l "$crate"
          sha256sum "$crate"
          mkdir unpacked
          tar -xzf "$crate" -C unpacked
          if grep -rInE '/home/|/Users/|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY|CARGO_REGISTRY_TOKEN|cio[A-Za-z0-9]{30}' unpacked; then
            echo "::error::the package contains something that looks like a local path, agent file or credential (see above)"
            exit 1
          fi
          echo "package contents OK: $(wc -l < files.txt) files, no unexpected paths or credential-looking strings"

      # The cache action's post step treats any directory named "tests" under
      # target/ as a trybuild workspace and tries to open tests/target and
      # tests/trybuild in it, which don't exist in the unpacked crate that
      # cargo package leaves in target/package/. It then logs four ENOENT
      # errors although the job passes. Nothing needs target/package after the
      # contents check, so remove it before the cache's post step runs.
      - name: Remove the unpacked package (the cache cleanup trips over its tests/ directory)
        if: always()
        run: rm -rf target/package

  build:
    name: build (${{ matrix.target }})
    needs: [guard, checks, cargo-deny, package]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl: runs on any Linux of that architecture. The crate has
          # no C dependencies (rustix uses raw syscalls, libc is bindings
          # only), so the aarch64 build only needs a linker that knows
          # aarch64: the distro's cross gcc (gcc-aarch64-linux-gnu). rustc
          # brings its own musl C runtime. Nothing is fetched except apt
          # packages and the Rust toolchain.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            kind: linux
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            kind: linux
            arch: aarch64
            linker: aarch64-linux-gnu-gcc
          # macOS: arm64 natively on the macos-15 runner; Intel is
          # cross-compiled there with the Apple toolchain (and smoke-tested
          # under Rosetta when the runner has it).
          - target: aarch64-apple-darwin
            runner: macos-15
            kind: macos
            arch: aarch64
          - target: x86_64-apple-darwin
            runner: macos-15
            kind: macos
            arch: x86_64
          # Windows: x86_64 MSVC only, built natively. The C runtime is linked
          # statically so the exe needs no Visual C++ redistributable. The zip is
          # not code-signed.
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            kind: windows
            arch: x86_64
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: Install the aarch64 cross linker and QEMU user-mode emulation
        if: matrix.kind == 'linux' && matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user

      - name: Build
        if: matrix.kind != 'windows'
        env:
          LINKER: ${{ matrix.linker }}
          # Smaller binaries, and no builder paths baked into them.
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: |
          set -euo pipefail
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/build --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$HOME/.rustup=/rustup"
          args=(--release --locked --target "$TARGET")
          if [ -n "$LINKER" ]; then
            args+=(--config "target.$TARGET.linker=\"$LINKER\"")
          fi
          cargo build "${args[@]}"
          file "target/$TARGET/release/cloakenv"

      - name: Check what was built (Linux)
        if: matrix.kind == 'linux'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/cloakenv"
          machine=$(readelf -h "$bin" | awk -F: '/Machine:/ {gsub(/^ +/, "", $2); print $2}')
          echo "machine: $machine"
          case "$ARCH" in
            x86_64) want="Advanced Micro Devices X86-64" ;;
            aarch64) want="AArch64" ;;
          esac
          [ "$machine" = "$want" ] || { echo "::error::expected $want, got $machine"; exit 1; }
          # Capture first: grep -q exiting early would SIGPIPE readelf and trip pipefail.
          segments=$(readelf -lW "$bin")
          dynamic=$(readelf -dW "$bin" 2>/dev/null || true)
          # Fully static: no interpreter, no shared-library dependencies.
          if grep -q INTERP <<<"$segments" || grep -q NEEDED <<<"$dynamic"; then
            echo "::error::$bin is not statically linked"
            exit 1
          fi
          echo "statically linked"
          if grep -qaF -e "$GITHUB_WORKSPACE" -e "$HOME" "$bin"; then
            echo "::error::$bin contains a builder path"
            exit 1
          fi

      - name: Check what was built (macOS)
        if: matrix.kind == 'macos'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/cloakenv"
          archs=$(lipo -archs "$bin")
          echo "architectures: $archs"
          [ "$archs" = "$([ "$ARCH" = aarch64 ] && echo arm64 || echo x86_64)" ] \
            || { echo "::error::unexpected architecture $archs for $ARCH"; exit 1; }
          echo "dynamic dependencies:"
          otool -L "$bin"
          if grep -qaF -e "$GITHUB_WORKSPACE" -e "$HOME" "$bin"; then
            echo "::error::$bin contains a builder path"
            exit 1
          fi

      - name: Package
        if: matrix.kind != 'windows'
        run: |
          set -euo pipefail
          name="cloakenv-$VERSION-$TARGET"
          rm -rf dist
          mkdir -p "dist/$name"
          install -m 755 "target/$TARGET/release/cloakenv" "dist/$name/cloakenv"
          install -m 644 LICENSE-MIT LICENSE-APACHE README.md CHANGELOG.md "dist/$name/"
          # Reproducible archive (identical on Linux and macOS): sorted names,
          # fixed owner and modes, commit timestamp, no gzip header time.
          epoch=$(git log -1 --format=%ct)
          python3 - "$name" "$epoch" <<'PY'
          import gzip, io, os, sys, tarfile
          name, epoch = sys.argv[1], int(sys.argv[2])
          def norm(info):
              info.uid = info.gid = 0
              info.uname = info.gname = ""
              info.mtime = epoch
              info.mode = 0o755 if info.isdir() or os.access(os.path.join("dist", info.name), os.X_OK) else 0o644
              return info
          raw = io.BytesIO()
          with tarfile.open(fileobj=raw, mode="w", format=tarfile.PAX_FORMAT) as tar:
              tar.add(os.path.join("dist", name), arcname=name, recursive=False, filter=norm)
              for entry in sorted(os.listdir(os.path.join("dist", name))):
                  tar.add(os.path.join("dist", name, entry), arcname=name + "/" + entry, filter=norm)
          with open(os.path.join("dist", name + ".tar.gz"), "wb") as out:
              with gzip.GzipFile(filename="", mode="wb", fileobj=out, compresslevel=9, mtime=0) as gz:
                  gz.write(raw.getvalue())
          PY
          ls -l dist
          tar -tzvf "dist/$name.tar.gz"

      - name: Build (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        env:
          # Smaller binary, and no PDB path baked into it.
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: |
          $ErrorActionPreference = 'Stop'
          $env:RUSTFLAGS = "-C target-feature=+crt-static --remap-path-prefix=$env:GITHUB_WORKSPACE=/build --remap-path-prefix=$env:USERPROFILE\.cargo=/cargo --remap-path-prefix=$env:USERPROFILE\.rustup=/rustup"
          cargo build --release --locked --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed ($LASTEXITCODE)" }
          Get-Item "target/$env:TARGET/release/cloakenv.exe" | Format-List Name, Length

      - name: Check what was built (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import os, struct, sys
          path = os.path.join("target", os.environ["TARGET"], "release", "cloakenv.exe")
          data = open(path, "rb").read()
          off = struct.unpack_from("<I", data, 0x3C)[0]
          if data[off:off + 4] != b"PE\0\0":
              sys.exit("::error::not a PE file")
          machine = struct.unpack_from("<H", data, off + 4)[0]
          # Optional header starts 24 bytes after the PE signature; Subsystem is at +68.
          subsystem = struct.unpack_from("<H", data, off + 24 + 68)[0]
          print(f"machine: {machine:#06x} (want 0x8664, x86-64); subsystem: {subsystem} (want 3, console)")
          if machine != 0x8664:
              sys.exit("::error::expected an x86-64 binary")
          if subsystem != 3:
              sys.exit("::error::expected a console binary")
          # No builder path (PDB path, source paths) in the binary.
          for needle in (os.environ["GITHUB_WORKSPACE"], os.environ["USERPROFILE"]):
              for variant in {needle, needle.replace("\\", "/")}:
                  if variant.encode() in data or variant.encode("utf-16-le") in data:
                      sys.exit(f"::error::the binary contains a builder path: {variant}")
          # CRT linked statically: no Visual C++ runtime DLL in the import table.
          lowered = data.lower()
          for dll in (b"vcruntime140", b"msvcp140", b"api-ms-win-crt"):
              if dll in lowered:
                  sys.exit(f"::error::the binary imports {dll.decode()}: the C runtime is not static")
          print("no builder path; C runtime is static")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "binary check failed" }

      - name: Package (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $epoch = git log -1 --format=%ct
          @'
          import os, sys, time, zipfile
          name = f"cloakenv-{os.environ['VERSION']}-{os.environ['TARGET']}"
          epoch = int(sys.argv[1])
          stamp = time.gmtime(max(epoch, 315532800))[:6]  # zip cannot go before 1980
          files = [
              (os.path.join("target", os.environ["TARGET"], "release", "cloakenv.exe"), "cloakenv.exe", 0o755),
              ("LICENSE-MIT", "LICENSE-MIT", 0o644),
              ("LICENSE-APACHE", "LICENSE-APACHE", 0o644),
              ("README.md", "README.md", 0o644),
              ("CHANGELOG.md", "CHANGELOG.md", 0o644),
          ]
          os.makedirs("dist", exist_ok=True)
          out = os.path.join("dist", name + ".zip")
          # Reproducible: sorted names, fixed timestamp, fixed modes.
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for src, arc, mode in sorted(files, key=lambda f: f[1]):
                  info = zipfile.ZipInfo(f"{name}/{arc}", date_time=stamp)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (mode & 0xFFFF) << 16
                  with open(src, "rb") as f:
                      z.writestr(info, f.read(), compresslevel=9)
          print(out, os.path.getsize(out))
          '@ | python - $epoch
          if ($LASTEXITCODE -ne 0) { throw "packaging failed" }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Smoke test (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: .github/scripts/smoke-test.ps1 -Archive "dist/cloakenv-$env:VERSION-$env:TARGET.zip" -Version $env:VERSION

      # Smoke-test the archive we're about to ship, not the build directory.
      # See .github/scripts/smoke-test.sh: init / set / list / run, --shield,
      # exit codes and fail-closed, with a dummy passphrase in a temp dir.
      - name: Smoke test (native)
        if: matrix.arch == 'x86_64' && matrix.kind == 'linux' || matrix.arch == 'aarch64' && matrix.kind == 'macos'
        run: .github/scripts/smoke-test.sh "dist/cloakenv-$VERSION-$TARGET.tar.gz" "$VERSION"

      # Intel macOS binary on the arm64 runner: needs Rosetta. Skip loudly
      # (never silently) if it isn't installed.
      - name: Smoke test (x86_64 macOS, under Rosetta)
        if: matrix.kind == 'macos' && matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            .github/scripts/smoke-test.sh "dist/cloakenv-$VERSION-$TARGET.tar.gz" "$VERSION" arch -x86_64
          else
            echo "::warning::Rosetta is not available on this runner: the x86_64 macOS archive was built but NOT smoke-tested"
          fi

      # No aarch64 Linux runner: run what can run under qemu-user. The
      # binary is static, so no sysroot is needed.
      - name: Smoke test (aarch64 Linux, under QEMU)
        if: matrix.kind == 'linux' && matrix.arch == 'aarch64'
        run: .github/scripts/smoke-test.sh "dist/cloakenv-$VERSION-$TARGET.tar.gz" "$VERSION" qemu-aarch64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: dist/cloakenv-${{ needs.guard.outputs.version }}-${{ matrix.target }}.${{ matrix.kind == 'windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: error
          retention-days: 7

  # Collect the archives, write and verify SHA256SUMS, and keep the lot as ONE
  # workflow-run artifact. Run artifacts, not a release: nothing leaves this
  # workflow run.
  checksums:
    name: SHA256SUMS
    needs: [guard, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
          path: out
      - name: Write and verify SHA256SUMS
        working-directory: out
        run: |
          set -euo pipefail
          ls -l
          tars=$(find . -maxdepth 1 -name 'cloakenv-*.tar.gz' | wc -l)
          zips=$(find . -maxdepth 1 -name 'cloakenv-*.zip' | wc -l)
          if [ "$tars" -ne 4 ] || [ "$zips" -ne 1 ]; then
            echo "::error::expected 4 .tar.gz archives and 1 .zip, found $tars and $zips"
            exit 1
          fi
          sha256sum cloakenv-*.tar.gz cloakenv-*.zip > SHA256SUMS
          cat SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ needs.guard.outputs.version }}
          path: |
            out/cloakenv-*.tar.gz
            out/cloakenv-*.zip
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # Draft GitHub release for a real tag. Runs only after the guard (tag format,
  # tag == Cargo.toml version, commit on the default branch, changelog section)
  # and every build and check have passed, and only for a tag push: a manual
  # run has no tag and stops at the checksums job.
  #
  # The release is a DRAFT: nothing is visible to the public until a maintainer
  # reads it on GitHub and presses Publish. This job never publishes, never
  # touches crates.io, and never overwrites a release: if one already exists for
  # the tag the step fails and says so.
  release:
    name: draft GitHub release
    if: github.ref_type == 'tag'
    needs: [guard, checksums]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release (this job only)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-${{ needs.guard.outputs.version }}
          path: out
      - name: Create the draft release
        run: |
          set -euo pipefail

          # The artifact must still be intact, and must hold exactly the five
          # archives (four .tar.gz and the Windows .zip) and their checksums.
          (cd out && sha256sum --check --strict SHA256SUMS)
          tars=$(find out -maxdepth 1 -name 'cloakenv-*.tar.gz' | wc -l)
          zips=$(find out -maxdepth 1 -name 'cloakenv-*.zip' | wc -l)
          if [ "$tars" -ne 4 ] || [ "$zips" -ne 1 ]; then
            echo "::error::expected 4 .tar.gz archives and 1 .zip in the artifact, found $tars and $zips"
            exit 1
          fi

          # Release notes: the changelog section for this version, verbatim
          # (it carries the known limitations), plus how to verify the download.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit } # next release, or the link lines at the end
            on { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::no changelog section for $VERSION"
            exit 1
          fi
          {
            echo
            echo "---"
            echo
            echo 'Verify a download with `sha256sum --check SHA256SUMS` (run it in the folder that holds the archives); on Windows, compare `Get-FileHash -Algorithm SHA256 <file>` with the line for it in `SHA256SUMS`.'
            echo
            echo 'The Windows zip is not code-signed, so SmartScreen or antivirus software may warn about it.'
          } >> notes.md

          flags=(--draft --verify-tag --title "cloakenv $VERSION" --notes-file notes.md)
          # A pre-release tag (v1.2.3-rc.1) is marked as one.
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac

          gh release create "$TAG" out/cloakenv-*.tar.gz out/cloakenv-*.zip out/SHA256SUMS "${flags[@]}"
          echo "::notice::draft release created for $TAG: review it on the Releases page and publish it by hand"
