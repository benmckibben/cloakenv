name: Release build

# BUILD ONLY. This workflow compiles release binaries and uploads them as
# artifacts of the workflow run (visible to people with access to this
# repository's Actions tab, and deleted after the retention period). It does
# not publish anything:
#   - no GitHub Release is created and no tag is pushed (the token is
#     read-only, so it couldn't);
#   - no cargo publish, no crates.io token, no repository secrets are used;
#   - no attestations (see "Provenance" below).
# Cutting the actual release (tag, GitHub Release, crates.io) is a manual step;
# see CONTRIBUTING.md.
#
# It has no schedule trigger: only a `v*` tag push or a manual dispatch starts it.

on:
  push:
    tags: ["v*"]
  # Dry-run the whole pipeline from any branch, without a tag.
  workflow_dispatch:

# Read-only token, workflow-wide. Don't add write scopes here: a release
# workflow that can write is one bug away from publishing.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# Provenance: not enabled on purpose. actions/attest-build-provenance needs
# id-token: write and attestations: write; artifact attestations aren't
# available for private repositories on GitHub Free/Pro; and on a public
# repository they are signed with the public-good Sigstore instance and
# recorded in its public transparency log, which is a public publication that
# this build-only workflow must not make. Once the repository is public and a
# real release is intended, add the action to the "checksums" job (grant the
# two write permissions on that job only, not workflow-wide) and attest
# out/*.tar.gz and out/SHA256SUMS.

# Third-party actions are pinned to full commit SHAs (tag in the trailing
# comment); Dependabot keeps them current via .github/dependabot.yml.

jobs:
  # Cheap, fast guard: does the tag match the crate, is it on main, and does
  # the changelog have a section for it?
  guard:
    name: tag and version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tagged commit must be reachable from the default branch
      - id: meta
        name: Check the tag against Cargo.toml
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "cloakenv") | .version')
          if [ -z "$version" ]; then
            echo "::error::couldn't read the version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $version"

          if [ "$REF_TYPE" != "tag" ]; then
            echo "::notice::not a tag run ($REF_TYPE $REF_NAME): building $version for testing only"
            exit 0
          fi

          # v<semver>, nothing else.
          if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$REF_NAME' is not of the form vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          if [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag '$REF_NAME' doesn't match version $version in Cargo.toml (expected v$version)"
            exit 1
          fi

          # Never release a commit that isn't on the default branch.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$GITHUB_SHA is not reachable from $DEFAULT_BRANCH; release tags must point at a commit on $DEFAULT_BRANCH"
            exit 1
          fi

          # The release must have its own changelog section (moved out of
          # "Unreleased").
          if ! grep -Eq "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          echo "tag $REF_NAME matches Cargo.toml, is on $DEFAULT_BRANCH and has a changelog section"

  # The same checks CI runs, on the commit being released: formatting, clippy,
  # and the test suite on stable, on the MSRV, on macOS and on static musl.
  checks:
    name: checks (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: "linux stable", os: ubuntu-24.04, toolchain: stable, lint: true }
          # "1.87" must match rust-version in Cargo.toml (MSRV).
          - { name: "linux msrv", os: ubuntu-24.04, toolchain: "1.87" }
          - { name: "macos stable", os: macos-15, toolchain: stable }
          - { name: "linux musl", os: ubuntu-24.04, toolchain: stable, target: x86_64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.name }}
      - name: rustfmt
        if: matrix.lint
        run: cargo fmt --all --check
      - name: clippy
        if: matrix.lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          args=(--locked --no-fail-fast)
          if [ -n "$TARGET" ]; then
            args+=(--target "$TARGET")
          fi
          cargo test "${args[@]}"

  # Dependency audit against deny.toml (advisories, licences, bans, sources),
  # the same action and arguments as ci.yml.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The prebuilt release binary, checked against its published SHA-256. The
      # cargo-deny-action builds a Docker image from Docker Hub on every run,
      # which fails whenever Docker Hub rate-limits the runner.
      - name: Install cargo-deny
        env:
          VERSION: 0.20.2
          SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-$VERSION-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-connrefused --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$VERSION/$name.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 "$name/cargo-deny"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: cargo-deny --all-features check

  # cargo package builds the .crate that would go to crates.io, entirely
  # locally (and verifies it compiles from the extracted package). Nothing is
  # uploaded or published; this only checks what would be in it.
  package:
    name: package check (cargo package)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-package
          # Cache the registry only. The cache's cleanup of target/ walks
          # target/package/<crate>-<version>/ (the unpacked crate) and fails
          # with ENOENT errors there; this job gains little from a cached target/.
          cache-targets: false
      - name: cargo package --locked (build and verify the .crate locally)
        run: cargo package --locked
      - name: Check the package contents
        run: |
          set -euo pipefail
          cargo package --list --locked > files.txt
          echo "::group::cargo package --list"
          cat files.txt
          echo "::endgroup::"

          # Allow-list: the manifest, lockfile, docs, licences, sources and tests.
          # Anything else (editor files, CI config, notes, keys, ...) fails.
          allowed='^(Cargo\.toml|Cargo\.toml\.orig|Cargo\.lock|\.cargo_vcs_info\.json|README\.md|CHANGELOG\.md|SECURITY\.md|CONTRIBUTING\.md|LICENSE-MIT|LICENSE-APACHE|docs/[A-Za-z0-9_-]+\.md|src/[A-Za-z0-9_/]+\.rs|tests/[A-Za-z0-9_/]+\.rs)$'
          unexpected=$(grep -Ev "$allowed" files.txt || true)
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected files in the package:"
            echo "$unexpected"
            exit 1
          fi

          for f in Cargo.toml Cargo.lock README.md CHANGELOG.md SECURITY.md CONTRIBUTING.md LICENSE-MIT LICENSE-APACHE docs/ARCHITECTURE.md src/main.rs src/lib.rs; do
            if ! grep -qx "$f" files.txt; then
              echo "::error::$f is missing from the package"
              exit 1
            fi
          done

          # Belt and braces: look inside the packaged files for things that
          # shouldn't ship (local paths, agent tooling, credentials). The token
          # patterns need a realistic length: the tests deliberately contain
          # dummy secrets shaped like tokens but cut short (ghp_ta…ue42).
          version=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "cloakenv") | .version')
          crate="target/package/cloakenv-$version.crate"
          ls -l "$crate"
          sha256sum "$crate"
          mkdir unpacked
          tar -xzf "$crate" -C unpacked
          if grep -rInE '/home/|/Users/|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY|CARGO_REGISTRY_TOKEN|cio[A-Za-z0-9]{30}' unpacked; then
            echo "::error::the package contains something that looks like a local path, agent file or credential (see above)"
            exit 1
          fi
          echo "package contents OK: $(wc -l < files.txt) files, no unexpected paths or credential-looking strings"

  build:
    name: build (${{ matrix.target }})
    needs: [guard, checks, cargo-deny, package]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl: runs on any Linux of that architecture. The crate has
          # no C dependencies (rustix uses raw syscalls, libc is bindings
          # only), so the aarch64 build only needs a linker that knows
          # aarch64: the distro's cross gcc (gcc-aarch64-linux-gnu). rustc
          # brings its own musl C runtime. Nothing is fetched except apt
          # packages and the Rust toolchain.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            kind: linux
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            kind: linux
            arch: aarch64
            linker: aarch64-linux-gnu-gcc
          # macOS: arm64 natively on the macos-15 runner; Intel is
          # cross-compiled there with the Apple toolchain (and smoke-tested
          # under Rosetta when the runner has it).
          - target: aarch64-apple-darwin
            runner: macos-15
            kind: macos
            arch: aarch64
          - target: x86_64-apple-darwin
            runner: macos-15
            kind: macos
            arch: x86_64
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: Install the aarch64 cross linker and QEMU user-mode emulation
        if: matrix.kind == 'linux' && matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user

      - name: Build
        env:
          LINKER: ${{ matrix.linker }}
          # Smaller binaries, and no builder paths baked into them.
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: |
          set -euo pipefail
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/build --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$HOME/.rustup=/rustup"
          args=(--release --locked --target "$TARGET")
          if [ -n "$LINKER" ]; then
            args+=(--config "target.$TARGET.linker=\"$LINKER\"")
          fi
          cargo build "${args[@]}"
          file "target/$TARGET/release/cloakenv"

      - name: Check what was built (Linux)
        if: matrix.kind == 'linux'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/cloakenv"
          machine=$(readelf -h "$bin" | awk -F: '/Machine:/ {gsub(/^ +/, "", $2); print $2}')
          echo "machine: $machine"
          case "$ARCH" in
            x86_64) want="Advanced Micro Devices X86-64" ;;
            aarch64) want="AArch64" ;;
          esac
          [ "$machine" = "$want" ] || { echo "::error::expected $want, got $machine"; exit 1; }
          # Capture first: grep -q exiting early would SIGPIPE readelf and trip pipefail.
          segments=$(readelf -lW "$bin")
          dynamic=$(readelf -dW "$bin" 2>/dev/null || true)
          # Fully static: no interpreter, no shared-library dependencies.
          if grep -q INTERP <<<"$segments" || grep -q NEEDED <<<"$dynamic"; then
            echo "::error::$bin is not statically linked"
            exit 1
          fi
          echo "statically linked"
          if grep -qaF -e "$GITHUB_WORKSPACE" -e "$HOME" "$bin"; then
            echo "::error::$bin contains a builder path"
            exit 1
          fi

      - name: Check what was built (macOS)
        if: matrix.kind == 'macos'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/cloakenv"
          archs=$(lipo -archs "$bin")
          echo "architectures: $archs"
          [ "$archs" = "$([ "$ARCH" = aarch64 ] && echo arm64 || echo x86_64)" ] \
            || { echo "::error::unexpected architecture $archs for $ARCH"; exit 1; }
          echo "dynamic dependencies:"
          otool -L "$bin"
          if grep -qaF -e "$GITHUB_WORKSPACE" -e "$HOME" "$bin"; then
            echo "::error::$bin contains a builder path"
            exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail
          name="cloakenv-$VERSION-$TARGET"
          rm -rf dist
          mkdir -p "dist/$name"
          install -m 755 "target/$TARGET/release/cloakenv" "dist/$name/cloakenv"
          install -m 644 LICENSE-MIT LICENSE-APACHE README.md CHANGELOG.md "dist/$name/"
          # Reproducible archive (identical on Linux and macOS): sorted names,
          # fixed owner and modes, commit timestamp, no gzip header time.
          epoch=$(git log -1 --format=%ct)
          python3 - "$name" "$epoch" <<'PY'
          import gzip, io, os, sys, tarfile
          name, epoch = sys.argv[1], int(sys.argv[2])
          def norm(info):
              info.uid = info.gid = 0
              info.uname = info.gname = ""
              info.mtime = epoch
              info.mode = 0o755 if info.isdir() or os.access(os.path.join("dist", info.name), os.X_OK) else 0o644
              return info
          raw = io.BytesIO()
          with tarfile.open(fileobj=raw, mode="w", format=tarfile.PAX_FORMAT) as tar:
              tar.add(os.path.join("dist", name), arcname=name, recursive=False, filter=norm)
              for entry in sorted(os.listdir(os.path.join("dist", name))):
                  tar.add(os.path.join("dist", name, entry), arcname=name + "/" + entry, filter=norm)
          with open(os.path.join("dist", name + ".tar.gz"), "wb") as out:
              with gzip.GzipFile(filename="", mode="wb", fileobj=out, compresslevel=9, mtime=0) as gz:
                  gz.write(raw.getvalue())
          PY
          ls -l dist
          tar -tzvf "dist/$name.tar.gz"

      # Smoke-test the archive we're about to ship, not the build directory.
      # See .github/scripts/smoke-test.sh: init / set / list / run, --shield,
      # exit codes and fail-closed, with a dummy passphrase in a temp dir.
      - name: Smoke test (native)
        if: matrix.arch == 'x86_64' && matrix.kind == 'linux' || matrix.arch == 'aarch64' && matrix.kind == 'macos'
        run: .github/scripts/smoke-test.sh "dist/cloakenv-$VERSION-$TARGET.tar.gz" "$VERSION"

      # Intel macOS binary on the arm64 runner: needs Rosetta. Skip loudly
      # (never silently) if it isn't installed.
      - name: Smoke test (x86_64 macOS, under Rosetta)
        if: matrix.kind == 'macos' && matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            .github/scripts/smoke-test.sh "dist/cloakenv-$VERSION-$TARGET.tar.gz" "$VERSION" arch -x86_64
          else
            echo "::warning::Rosetta is not available on this runner: the x86_64 macOS archive was built but NOT smoke-tested"
          fi

      # No aarch64 Linux runner: run what can run under qemu-user. The
      # binary is static, so no sysroot is needed.
      - name: Smoke test (aarch64 Linux, under QEMU)
        if: matrix.kind == 'linux' && matrix.arch == 'aarch64'
        run: .github/scripts/smoke-test.sh "dist/cloakenv-$VERSION-$TARGET.tar.gz" "$VERSION" qemu-aarch64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: dist/cloakenv-${{ needs.guard.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Collect the archives, write and verify SHA256SUMS, and keep the lot as ONE
  # workflow-run artifact. Run artifacts, not a release: nothing leaves this
  # workflow run.
  checksums:
    name: SHA256SUMS
    needs: [guard, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
          path: out
      - name: Write and verify SHA256SUMS
        working-directory: out
        run: |
          set -euo pipefail
          ls -l
          count=$(find . -maxdepth 1 -name 'cloakenv-*.tar.gz' | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "::error::expected 4 archives, found $count"
            exit 1
          fi
          sha256sum cloakenv-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ needs.guard.outputs.version }}
          path: |
            out/cloakenv-*.tar.gz
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
