[package]
name = "cloakenv"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Lightweight encrypted local secret vault and zero-leak process injection engine"
repository = "https://github.com/benmckibben/cloakenv"
readme = "README.md"
keywords = ["secrets", "security", "vault", "env", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "cloakenv"
path = "src/lib.rs"

[[bin]]
name = "cloakenv"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4"
rpassword = "7.5.4"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = "3.27.0"

# Argon2id is painfully slow without optimizations; keep debug builds and the
# test suite usable while still exercising production-strength KDF parameters.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
