name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly dependency audit, so new RustSec advisories against the locked
  # dependency tree show up without a push. Only the cargo-deny job runs on
  # schedule; the build/test jobs skip (they gate on event_name below).
  schedule:
    - cron: "17 14 * * 1" # Mondays 14:17 UTC

# Read-only token: CI never needs to write to the repo. No publishing here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# Third-party actions are pinned to full commit SHAs (tag in the trailing
# comment); Dependabot keeps them current via .github/dependabot.yml.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'schedule'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, toolchain: stable }
          # Must match rust-version in Cargo.toml (MSRV).
          - { os: ubuntu-24.04, toolchain: "1.87" }
          # Vault permissions, process spawning and --shield use Unix APIs
          # that differ on macOS; run the suite there too.
          - { os: macos-15, toolchain: stable }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.toolchain }}
      - run: cargo test --locked --no-fail-fast

  # Dependency audit against deny.toml: RustSec advisories (vulnerable, unsound,
  # unmaintained, yanked), licence allow-list, bans (wildcards, duplicates) and
  # sources (crates.io only). The only job that also runs on the weekly schedule.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The prebuilt release binary, checked against its published SHA-256. The
      # cargo-deny-action builds a Docker image from Docker Hub on every run,
      # which fails whenever Docker Hub rate-limits the runner.
      - name: Install cargo-deny
        env:
          VERSION: 0.20.2
          SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-$VERSION-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-connrefused --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$VERSION/$name.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 "$name/cargo-deny"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: cargo-deny --all-features check
